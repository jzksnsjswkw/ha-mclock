plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ha.mclock'
    compileSdk 34

    defaultConfig {
        applicationId "com.ha.mclock"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../src']
            res.srcDirs = ['../res']
        }
    }
}

dependencies {
}
